<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="소규모">
  <meta name="format-detection" content="telephone=no">
  <title>소규모</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    :root {
      color-scheme: light;
      --drop-blue:#247dcc;
      --drop-blue-dark:#1767ae;
      --border:#d8dee5;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#fff; color:#111; }
    body {
      font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-text-size-adjust:100%;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .app { min-height:100vh; padding:14px 18px 18px; }
    .header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand { display:flex; align-items:center; gap:7px; min-width:0; }
    .drop { font-size:28px; line-height:1; }
    .title { font-size:25px; font-weight:700; line-height:1.2; }
    .header-actions { display:flex; align-items:center; gap:9px; }

    .edit-btn,
    .address-btn {
      appearance:none;
      -webkit-appearance:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-width:84px;
      height:38px;
      padding:0 13px;
      border:1px solid var(--drop-blue-dark);
      border-radius:7px;
      background:linear-gradient(#2f8ddd, var(--drop-blue));
      color:#fff;
      font-size:16px;
      font-weight:700;
      line-height:1;
      box-shadow:0 3px 0 var(--drop-blue-dark), 0 4px 7px rgba(0,0,0,.16);
      text-shadow:0 1px 0 rgba(0,0,0,.18);
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      transform:translateY(0);
    }
    .edit-btn:active,
    .address-btn:active {
      transform:translateY(2px);
      box-shadow:0 1px 0 var(--drop-blue-dark), 0 2px 4px rgba(0,0,0,.14);
    }
    .edit-btn[disabled],
    .address-btn[disabled] { opacity:.58; cursor:default; }

    .pen { font-size:18px; line-height:1; }

    #status {
      min-height:34px;
      padding:8px 0;
      font-size:13px;
      color:#333;
    }
    #notice {
      display:none;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      font-size:19px;
      line-height:1.28;
      padding:18px 0;
      user-select:text;
      -webkit-user-select:text;
    }
    #editor {
      display:none;
      width:100%;
      min-height:calc(100vh - 125px);
      margin-top:10px;
      padding:14px;
      resize:vertical;
      border:1px solid var(--border);
      border-radius:8px;
      outline:none;
      background:#fff;
      color:#111;
      font:inherit;
      font-size:19px;
      line-height:1.28;
      white-space:pre-wrap;
      box-shadow:inset 0 1px 3px rgba(0,0,0,.08);
    }
    #editor:focus {
      border-color:var(--drop-blue);
      box-shadow:0 0 0 2px rgba(36,125,204,.15), inset 0 1px 3px rgba(0,0,0,.06);
    }
    #error {
      display:none;
      font-size:16px;
      padding-top:18px;
      color:#b00020;
    }

    .modal-backdrop {
      display:none;
      position:fixed;
      inset:0;
      z-index:1000;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(0,0,0,.34);
    }
    .modal-backdrop.show { display:flex; }
    .modal {
      width:min(330px, 100%);
      background:#fff;
      border-radius:13px;
      padding:22px 20px 18px;
      box-shadow:0 12px 35px rgba(0,0,0,.28);
      text-align:center;
    }
    .modal-title { font-size:20px; font-weight:700; margin-bottom:14px; }
    .pin-input {
      width:150px;
      height:48px;
      padding:0 12px;
      border:1px solid #b9c1c9;
      border-radius:8px;
      text-align:center;
      font-size:24px;
      letter-spacing:8px;
      outline:none;
    }
    .pin-input:focus {
      border-color:var(--drop-blue);
      box-shadow:0 0 0 2px rgba(36,125,204,.14);
    }
    .pin-error { min-height:24px; padding-top:7px; color:#c62828; font-size:14px; }
    .modal-actions { display:flex; gap:9px; margin-top:9px; }
    .modal-btn {
      flex:1;
      height:42px;
      border-radius:7px;
      border:1px solid #c5cbd1;
      background:#f4f5f6;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
    .modal-btn.primary {
      border-color:var(--drop-blue-dark);
      background:var(--drop-blue);
      color:#fff;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="header">
      <div class="brand"><span class="drop">💧</span><span class="title">소규모</span></div>
      <div class="header-actions">
        <button id="addressButton" class="address-btn" type="button" aria-label="주소록 열기">
          <span>주소록</span>
        </button>
        <button id="editButton" class="edit-btn" type="button" aria-label="공지 수정">
          <span id="editIcon" class="pen">✎</span><span id="editLabel">수정</span>
        </button>
      </div>
    </div>

    <div id="status">로딩중</div>
    <div id="notice"></div>
    <textarea id="editor" spellcheck="false" aria-label="공지 내용 수정"></textarea>
    <div id="error"></div>
  </main>

  <div id="pinModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <div class="modal">
      <div id="pinTitle" class="modal-title">비밀번호 입력</div>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric"
             pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4자리 비밀번호">
      <div id="pinError" class="pin-error"></div>
      <div class="modal-actions">
        <button id="pinCancel" class="modal-btn" type="button">취소</button>
        <button id="pinConfirm" class="modal-btn primary" type="button">확인</button>
      </div>
    </div>
  </div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyhPGeN1AdXtMQEHY653l_z1BJLQqtQwUety85UmJ9o4Hrm4DaNRmtISdt0rlh5Bi2q/exec";

// 안정성 설정
const REQUEST_TIMEOUT_MS = 20000;       // 한 번의 요청은 최대 20초까지 기다림
const READ_ATTEMPTS = 3;                // 공지/주소록 최대 3회 시도
const WRITE_ATTEMPTS = 3;               // 인증/저장도 일시 오류 시 재시도
const RETRY_DELAYS_MS = [800, 1500];    // 1→2회, 2→3회 사이 대기
const NOTICE_CACHE_KEY = 'sogyumo_notice_cache_v2';
const ADDRESS_CACHE_KEY = 'sogyumo_address_cache_v2';

const statusEl = document.getElementById('status');
const noticeEl = document.getElementById('notice');
const editorEl = document.getElementById('editor');
const errorEl = document.getElementById('error');
const addressButton = document.getElementById('addressButton');
const editButton = document.getElementById('editButton');
const editIcon = document.getElementById('editIcon');
const editLabel = document.getElementById('editLabel');
const pinModal = document.getElementById('pinModal');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
const pinCancel = document.getElementById('pinCancel');
const pinConfirm = document.getElementById('pinConfirm');

let loading = true;
let frame = 0;
let editMode = false;
let adminPin = '';
let currentText = '';
let addressText = '';
let viewMode = 'notice';
let timer = null;

// 화면 전환 중 늦게 도착한 과거 응답이 현재 화면을 덮어쓰는 것을 방지
let viewRequestId = 0;

const frames = ['로딩중', '로딩중.', '로딩중..', '로딩중...'];

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function startLoading(label='로딩중') {
  loading = true;
  frame = 0;
  if (timer) clearInterval(timer);
  statusEl.textContent = label;
  timer = setInterval(() => {
    if (!loading) return;
    statusEl.textContent = frames[frame++ % frames.length];
  }, 180);
}

function finishLoading() {
  loading = false;
  if (timer) clearInterval(timer);
  timer = null;
}

function nowLabel(prefix) {
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${prefix}: ${mm}/${dd} ${hh}:${mi}`;
}

function formatSavedTime(timestamp) {
  const d = new Date(Number(timestamp));
  if (Number.isNaN(d.getTime())) return '';
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

function saveLocalCache(key, text) {
  try {
    localStorage.setItem(key, JSON.stringify({
      text: String(text == null ? '' : text),
      savedAt: Date.now()
    }));
  } catch (_) {
    // localStorage 사용이 제한된 환경이어도 앱 자체는 계속 동작
  }
}

function loadLocalCache(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || typeof data.text !== 'string') return null;
    return {
      text: data.text,
      savedAt: Number(data.savedAt) || 0
    };
  } catch (_) {
    return null;
  }
}

function showError(message) {
  finishLoading();
  statusEl.textContent = '';
  noticeEl.style.display = 'none';
  editorEl.style.display = 'none';
  errorEl.style.display = 'block';
  errorEl.textContent = message;
}

function setNoticeButtons() {
  viewMode = 'notice';
  addressButton.disabled = false;
  editIcon.textContent = '✎';
  editLabel.textContent = '수정';
  editButton.setAttribute('aria-label', '공지 수정');
}

function setAddressButtons() {
  viewMode = 'address';
  addressButton.disabled = true;
  editIcon.textContent = '←';
  editLabel.textContent = '이전';
  editButton.setAttribute('aria-label', '공지 화면으로 돌아가기');
}

function showNotice(text, statusText) {
  finishLoading();
  currentText = String(text == null ? '' : text);
  setNoticeButtons();
  errorEl.style.display = 'none';
  editorEl.style.display = 'none';
  noticeEl.textContent = currentText.trim() ? currentText : 'notice.txt가 비어 있습니다.';
  noticeEl.style.display = 'block';
  statusEl.textContent = statusText || nowLabel('최종 확인');
}

function showAddress(text, statusText) {
  finishLoading();
  addressText = String(text == null ? '' : text);
  editMode = false;
  adminPin = '';
  setAddressButtons();
  errorEl.style.display = 'none';
  editorEl.style.display = 'none';
  noticeEl.textContent = addressText.trim() ? addressText : '주소록이 비어 있습니다.';
  noticeEl.style.display = 'block';
  statusEl.textContent = statusText || nowLabel('주소록 확인');
}

function showNoticeFromCache(cache) {
  currentText = cache.text;
  showNotice(
    cache.text,
    '서버 연결 실패 · 마지막 확인: ' + formatSavedTime(cache.savedAt)
  );
}

function showAddressFromCache(cache) {
  addressText = cache.text;
  showAddress(
    cache.text,
    '서버 연결 실패 · 마지막 확인: ' + formatSavedTime(cache.savedAt)
  );
}

function jsonp(params, timeoutMs=REQUEST_TIMEOUT_MS) {
  return new Promise((resolve, reject) => {
    const callbackName =
      '__sogyumo_' + Date.now() + '_' + Math.random().toString(36).slice(2);

    const script = document.createElement('script');
    let settled = false;

    const timeout = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('응답 시간이 초과되었습니다.'));
    }, timeoutMs);

    function cleanup() {
      clearTimeout(timeout);
      try { delete window[callbackName]; } catch (_) {}
      try { script.remove(); } catch (_) {}
    }

    window[callbackName] = payload => {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(payload || {});
    };

    script.onerror = () => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('서버에 연결하지 못했습니다.'));
    };

    const query = new URLSearchParams({
      ...params,
      callback: callbackName,
      t: Date.now().toString()
    });

    script.src = PROXY_URL + '?' + query.toString();
    script.async = true;
    document.head.appendChild(script);
  });
}

async function requestWithRetry(params, options={}) {
  const attempts = Math.max(1, Number(options.attempts || READ_ATTEMPTS));
  const timeoutMs = Number(options.timeoutMs || REQUEST_TIMEOUT_MS);
  const onRetry = typeof options.onRetry === 'function' ? options.onRetry : null;

  let lastError = null;

  for (let attempt = 1; attempt <= attempts; attempt++) {
    try {
      const payload = await jsonp(params, timeoutMs);

      if (!payload || !payload.ok) {
        throw new Error(
          payload && payload.error ? payload.error : '서버 응답이 올바르지 않습니다.'
        );
      }

      return payload;
    } catch (err) {
      lastError = err;

      if (attempt >= attempts) break;

      if (onRetry) onRetry(attempt + 1, attempts, err);

      const delay = RETRY_DELAYS_MS[Math.min(attempt - 1, RETRY_DELAYS_MS.length - 1)] || 1000;
      await sleep(delay);
    }
  }

  throw lastError || new Error('요청에 실패했습니다.');
}

async function loadNotice() {
  if (editMode) return;

  const myRequestId = ++viewRequestId;
  setNoticeButtons();

  noticeEl.style.display = 'none';
  editorEl.style.display = 'none';
  errorEl.style.display = 'none';
  startLoading('공지 불러오는 중');

  try {
    const payload = await requestWithRetry(
      { action:'read' },
      {
        attempts: READ_ATTEMPTS,
        onRetry: (next, total) => {
          if (myRequestId !== viewRequestId) return;
          finishLoading();
          statusEl.textContent = `연결 재시도 중 (${next}/${total})`;
        }
      }
    );

    if (myRequestId !== viewRequestId || viewMode !== 'notice') return;

    const text = payload.text || '';
    currentText = text;
    saveLocalCache(NOTICE_CACHE_KEY, text);
    showNotice(text, nowLabel('최종 확인'));
  } catch (err) {
    if (myRequestId !== viewRequestId || viewMode !== 'notice') return;

    const cache = loadLocalCache(NOTICE_CACHE_KEY);
    if (cache) {
      showNoticeFromCache(cache);
    } else {
      showError('내용을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
    }
  }
}

async function loadAddress() {
  if (editMode) return;

  const myRequestId = ++viewRequestId;
  setAddressButtons();

  noticeEl.style.display = 'none';
  editorEl.style.display = 'none';
  errorEl.style.display = 'none';
  startLoading('주소록 불러오는 중');

  try {
    const payload = await requestWithRetry(
      { action:'address' },
      {
        attempts: READ_ATTEMPTS,
        onRetry: (next, total) => {
          if (myRequestId !== viewRequestId) return;
          finishLoading();
          statusEl.textContent = `주소록 연결 재시도 중 (${next}/${total})`;
        }
      }
    );

    if (myRequestId !== viewRequestId || viewMode !== 'address') return;

    const text = payload.text || '';
    addressText = text;
    saveLocalCache(ADDRESS_CACHE_KEY, text);
    showAddress(text, nowLabel('주소록 확인'));
  } catch (err) {
    if (myRequestId !== viewRequestId || viewMode !== 'address') return;

    const cache = loadLocalCache(ADDRESS_CACHE_KEY);
    if (cache) {
      showAddressFromCache(cache);
    } else {
      showError('주소록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
    }
  }
}

function returnToNotice() {
  // 핵심 수정:
  // 기존 currentText를 그대로 표시하지 않고 Drive의 notice.txt를 다시 읽음
  ++viewRequestId; // 진행 중이던 주소록 요청 무효화
  setNoticeButtons();
  loadNotice();
}

function openPinModal() {
  pinInput.value = '';
  pinError.textContent = '';
  pinModal.classList.add('show');
  setTimeout(() => pinInput.focus(), 50);
}

function closePinModal() {
  pinModal.classList.remove('show');
  pinError.textContent = '';
}

async function verifyPin() {
  const pin = pinInput.value.trim();

  if (!/^\d{4}$/.test(pin)) {
    pinError.textContent = '4자리 숫자를 입력해주세요.';
    return;
  }

  pinConfirm.disabled = true;
  pinError.textContent = '확인중...';

  try {
    const payload = await requestWithRetry(
      { action:'auth', pin },
      {
        attempts: WRITE_ATTEMPTS,
        onRetry: (next, total) => {
          pinError.textContent = `연결 재시도 중 (${next}/${total})`;
        }
      }
    );

    if (payload.authorized) {
      adminPin = pin;
      closePinModal();
      enterEditMode();
    } else {
      pinError.textContent = '비밀번호가 올바르지 않습니다.';
      pinInput.select();
    }
  } catch (_) {
    pinError.textContent = '비밀번호를 확인하지 못했습니다. 다시 시도해주세요.';
  } finally {
    pinConfirm.disabled = false;
  }
}

function enterEditMode() {
  ++viewRequestId;
  viewMode = 'notice';
  addressButton.disabled = true;
  editMode = true;
  editLabel.textContent = '저장';
  noticeEl.style.display = 'none';
  errorEl.style.display = 'none';
  editorEl.value = currentText;
  editorEl.style.display = 'block';
  statusEl.textContent = '수정 중';

  setTimeout(() => {
    editorEl.focus();
    editorEl.setSelectionRange(editorEl.value.length, editorEl.value.length);
  }, 30);
}

async function saveRequest(params, timeoutMs=REQUEST_TIMEOUT_MS) {
  return requestWithRetry(params, {
    attempts: WRITE_ATTEMPTS,
    timeoutMs,
    onRetry: (next, total) => {
      statusEl.textContent = `저장 연결 재시도 중 (${next}/${total})`;
    }
  });
}

async function saveNotice() {
  if (!editMode || !adminPin) return;

  const text = editorEl.value;
  editButton.disabled = true;
  addressButton.disabled = true;
  editLabel.textContent = '저장중';
  statusEl.textContent = '저장중...';

  const token =
    Date.now().toString(36) + Math.random().toString(36).slice(2,10);

  const CHUNK_SIZE = 600;
  const chunks = [];

  for (let i = 0; i < text.length; i += CHUNK_SIZE) {
    chunks.push(text.slice(i, i + CHUNK_SIZE));
  }
  if (chunks.length === 0) chunks.push('');

  try {
    let p = await saveRequest({
      action:'saveStart',
      pin:adminPin,
      token
    });
    if (!p.ok) throw new Error(p.error || '저장을 시작하지 못했습니다.');

    for (let i = 0; i < chunks.length; i++) {
      p = await saveRequest({
        action:'saveChunk',
        pin:adminPin,
        token,
        index:String(i),
        data:chunks[i]
      });
      if (!p.ok) throw new Error(p.error || '저장 중 오류가 발생했습니다.');
    }

    p = await saveRequest({
      action:'saveFinish',
      pin:adminPin,
      token,
      count:String(chunks.length)
    }, 25000);

    if (!p.ok) throw new Error(p.error || '저장하지 못했습니다.');

    currentText = p.text != null ? String(p.text) : text;
    saveLocalCache(NOTICE_CACHE_KEY, currentText);

    editMode = false;
    adminPin = '';
    editIcon.textContent = '✎';
    editLabel.textContent = '수정';
    addressButton.disabled = false;

    showNotice(currentText, nowLabel('저장 완료'));
  } catch (err) {
    statusEl.textContent = '저장 실패';
    alert(
      '저장하지 못했습니다.\n' +
      (err && err.message ? err.message : '잠시 후 다시 시도해주세요.')
    );
    editLabel.textContent = '저장';
  } finally {
    editButton.disabled = false;
    if (!editMode) addressButton.disabled = false;
  }
}

addressButton.addEventListener('click', loadAddress);

editButton.addEventListener('click', () => {
  if (viewMode === 'address') {
    returnToNotice();
    return;
  }

  if (editMode) saveNotice();
  else openPinModal();
});

pinCancel.addEventListener('click', closePinModal);
pinConfirm.addEventListener('click', verifyPin);

pinInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') verifyPin();
  if (e.key === 'Escape') closePinModal();
});

pinInput.addEventListener('input', () => {
  pinInput.value = pinInput.value.replace(/\D/g, '').slice(0,4);
  pinError.textContent = '';
});

pinModal.addEventListener('click', e => {
  if (e.target === pinModal) closePinModal();
});

// 앱/홈 화면으로 다시 돌아왔을 때 공지 화면이라면 새 내용을 한 번 확인
document.addEventListener('visibilitychange', () => {
  if (
    document.visibilityState === 'visible' &&
    viewMode === 'notice' &&
    !editMode
  ) {
    loadNotice();
  }
});

startLoading();
loadNotice();
</script>
</body>
</html>
